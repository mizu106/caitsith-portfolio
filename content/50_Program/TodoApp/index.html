<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
    <meta name="color-scheme" content="light dark">
</head>
<body>
    <div class="app">
        <header class="app__header">
            <h1 class="app__title">Todo</h1>
            <div class="toolbar">
                <input id="searchInput" class="toolbar__search" type="search" placeholder="検索... (タイトル/タグ)" aria-label="検索">
                <div class="toolbar__filters" role="tablist" aria-label="フィルター">
                    <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全て</button>
                    <button class="chip" data-filter="active" role="tab" aria-selected="false">アクティブ</button>
                    <button class="chip" data-filter="completed" role="tab" aria-selected="false">完了</button>
                </div>
            </div>
        </header>

        <section class="composer" aria-labelledby="composerTitle">
            <h2 id="composerTitle" class="sr-only">新しいタスク</h2>
            <form id="todoForm" autocomplete="off">
                <input id="todoInput" type="text" class="input" placeholder="タスクを入力して Enter / 追加" aria-label="タスク名" required>
                <input id="dueInput" type="date" class="input input--small" aria-label="期日 (任意)">
                <select id="priorityInput" class="input input--small" aria-label="優先度 (任意)">
                    <option value="none">優先度</option>
                    <option value="low">低</option>
                    <option value="medium">中</option>
                    <option value="high">高</option>
                </select>
                <input id="tagsInput" type="text" class="input input--small" placeholder="#タグ, カンマ区切り (任意)" aria-label="タグ">
                <button type="submit" class="btn btn--primary">追加</button>
            </form>
        </section>

        <main>
            <ul id="todoList" class="todo-list" aria-live="polite"></ul>
        </main>

        <footer class="app__footer">
            <div class="status">
                <span id="countLabel">0 件</span>
            </div>
            <div class="footer-actions">
                <button id="clearCompletedBtn" class="btn btn--ghost">完了を削除</button>
                <button id="exportBtn" class="btn btn--ghost">エクスポート</button>
                <button id="importBtn" class="btn btn--ghost">インポート</button>
                <input id="importFile" type="file" accept="application/json" hidden>
            </div>
        </footer>
    </div>

    <template id="todoItemTemplate">
        <li class="todo">
            <label class="todo__check">
                <input type="checkbox" class="todo__checkbox" aria-label="完了">
                <span class="todo__checkbox-ui" aria-hidden="true"></span>
            </label>
            <div class="todo__body">
                <div class="todo__title" contenteditable="true" spellcheck="false"></div>
                <div class="todo__meta">
                    <span class="todo__due" hidden></span>
                    <span class="todo__priority" hidden></span>
                    <span class="todo__tags" hidden></span>
                </div>
            </div>
            <div class="todo__actions">
                <button class="icon-btn" data-action="edit" title="編集" aria-label="編集">✎</button>
                <button class="icon-btn" data-action="delete" title="削除" aria-label="削除">🗑</button>
            </div>
        </li>
    </template>

    <script src="main.js" defer></script>
    <noscript>このアプリを利用するには JavaScript を有効にしてください。</noscript>
    <div class="sr-only" aria-live="polite" id="a11yLive"></div>
    <div class="sr-only" aria-live="assertive" aria-atomic="true" id="a11yAssert"></div>
    <span class="sr-only" id="sr-instructions">タイトルはクリックして編集できます。Enter で確定、Esc で取消。</span>
    <script>
        // Provide minimal instructions for screen readers on load
        window.addEventListener('DOMContentLoaded', () => {
            const live = document.getElementById('a11yLive');
            if (live) live.textContent = '読み込み完了。タスクを追加してください。';
        });
    </script>
    
</body>
<!--
  ローカルで index.html をブラウザで開くだけで動作します。
-->
</html>

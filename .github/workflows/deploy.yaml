name: Deploy Quartz Site

on:
  push:
    branches:
      - v4  # またはあなたのメインブランチ名

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. コードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Node.js 環境をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"  # Quartz v4.5.x の要件
          cache: "npm"

      # 3. 依存関係をインストール
      - name: Install dependencies
        run: npm ci

      # 4. Quartz でビルド
      - name: Build Quartz site
        run: npx quartz build

      # 5. GitHub Pages にデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Quartz のビルド出力ディレクトリ
